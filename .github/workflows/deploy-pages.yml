name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'secretbox-ui/**'
      - 'objects/*_menu.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: secretbox-ui/package-lock.json

      - name: Build website
        working-directory: secretbox-ui
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://secretbox-main.onrender.com' }}
        run: |
          npm ci
          npm run build

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: secretbox-ui/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
